# TrueNAS-only workflow, not present upstream.  Runs the zfs-qemu test
# sequence on the Debian 13 image rebooted into the TrueNAS production
# kernel (debian13-tn), alongside the unmodified upstream zfs-qemu
# workflow which keeps testing the stock Debian kernel.  Comparing the
# two attributes a failure to the TrueNAS kernel (fails only here) or
# to the ZFS change itself (fails in both).
name: zfs-qemu-tn

on:
  # A push to a branch with an open PR fires both push and
  # pull_request, and both runs land in the same concurrency group
  # below, where cancel-in-progress kills whichever started first.  The
  # two are not interchangeable either: the push run resolves the train
  # from the head branch, the pull_request run from the base.  Only the
  # branches paired in .github/trains.json need the push trigger - they
  # are merge targets, never PR heads - and every other branch is
  # covered by its pull request.  on: cannot read trains.json, so keep
  # this list in step with the branch names there.
  push:
    branches:
      - truenas/zfs-2.4-release
      - stable/26
  pull_request:
  workflow_dispatch:
    inputs:
      kernel_train:
        type: string
        required: false
        default: ""
        description: "(optional) train from .github/trains.json whose kernel to test (default: mapped from the branch)"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-config:
    name: Setup
    if: github.event_name == 'pull_request' || github.repository != 'openzfs/zfs'
    runs-on: ubuntu-24.04
    outputs:
      ci_type: ${{ steps.os.outputs.ci_type }}
      train: ${{ steps.kernel.outputs.train }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate CI type
        id: os
        run: |
          ci_type="default"

          # determine CI type when running on PR
          if ${{ github.event_name == 'pull_request' }}; then
            head=${{ github.event.pull_request.head.sha }}
            base=${{ github.event.pull_request.base.sha }}
            read ci_type ci_source <<< "$(python3 .github/workflows/scripts/generate-ci-type.py $head $base)"
          fi

          echo "ci_type=$ci_type" | tee -a $GITHUB_OUTPUT
      - name: Determine TrueNAS kernel train
        id: kernel
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          # Manual override from workflow_dispatch
          TRAIN_OVERRIDE: ${{ github.event.inputs.kernel_train }}
        run: |
          # The VM boots the TrueNAS production kernel of the pairing
          # declared in .github/trains.json.  Branches paired with a
          # train use that train's kernel (PRs follow their base
          # branch); everything else defaults to the default_train
          # pairing.
          resolve=.github/workflows/scripts/resolve-train.py
          rc=0
          if [ -n "$TRAIN_OVERRIDE" ]; then
            entry=$("$resolve" train "$TRAIN_OVERRIDE") || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "ERROR: kernel_train '$TRAIN_OVERRIDE' is not a train" \
                "in .github/trains.json"
              exit 1
            fi
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              ref="$BASE_REF"
            else
              ref="$REF_NAME"
            fi
            entry=$("$resolve" branch "$ref") || rc=$?
            # Status 3 just means the branch is not paired with a
            # train of its own; anything else is a broken config
            # resolve-train.py has already explained.
            if [ "$rc" -eq 3 ]; then
              rc=0
              entry=$("$resolve" default)
            fi
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          echo "Kernel pairing: $entry"
          echo "train=$(jq -r '.train' <<< "$entry")" | tee -a "$GITHUB_OUTPUT"

  qemu-vm-tn:
    name: qemu-x86 (debian13-tn)
    needs: [ test-config ]
    if: >-
      (github.event_name == 'pull_request' ||
      github.repository != 'openzfs/zfs') &&
      needs.test-config.outputs.ci_type != 'docs'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Setup QEMU
      timeout-minutes: 60
      run: .github/workflows/scripts/qemu-1-setup.sh

    - name: Start build machine
      timeout-minutes: 10
      run: .github/workflows/scripts/qemu-2-start.sh debian13-tn

    - name: Install dependencies
      timeout-minutes: 60
      run: .github/workflows/scripts/qemu-3-deps.sh --poweroff debian13-tn

    - name: Install TrueNAS kernel
      timeout-minutes: 20
      env:
        TRAIN: ${{ needs.test-config.outputs.train }}
      run: .github/workflows/scripts/qemu-tn-kernel.sh "$TRAIN"

    - name: Build modules
      timeout-minutes: 30
      run: .github/workflows/scripts/qemu-4-build.sh --poweroff --enable-debug debian13-tn

    - name: Setup testing machines
      timeout-minutes: 5
      run: .github/workflows/scripts/qemu-5-setup.sh

    - name: Run tests
      timeout-minutes: 270
      run: .github/workflows/scripts/qemu-6-tests.sh
      env:
        CI_TYPE: ${{ needs.test-config.outputs.ci_type }}

    - name: Prepare artifacts
      if: always()
      timeout-minutes: 10
      run: .github/workflows/scripts/qemu-7-prepare.sh

    - uses: actions/upload-artifact@v7
      id: artifact-upload
      if: always()
      with:
        name: Logs-functional-debian13-tn
        path: /tmp/qemu-debian13-tn.tar.bz2
        archive: false
        if-no-files-found: ignore

    - name: Test Summary
      if: always()
      run: .github/workflows/scripts/qemu-8-summary.sh '${{ steps.artifact-upload.outputs.artifact-url }}'
