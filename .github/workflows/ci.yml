name: CI

on:
  push:
  # Dispatched by kernel-watch.yml on the deb-publishing branches when
  # the rolling TrueNAS kernel moves, so the published debs track
  # kernel updates as well as ZFS merges.
  workflow_dispatch:

jobs:

  build-native-deb:

    runs-on: ubuntu-22.04
    # The Debian release TrueNAS is based on
    container:
      image: debian:trixie

    # Container jobs default run steps to plain sh
    defaults:
      run:
        shell: bash

    outputs:
      train: ${{ steps.train.outputs.train }}
      publish: ${{ steps.train.outputs.publish }}

    steps:
      - name: Installing Dependencies
        run: |
          apt-get update > /dev/null 2>&1
          apt-get install -y ca-certificates python3 git jq equivs \
          debhelper-compat devscripts > /dev/null 2>&1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Map branch to TrueNAS train
        id: train
        run: |
          # .github/trains.json declares which ZFS branches are built
          # and published against which rolling TrueNAS kernels.
          # Branches paired there publish debs; everything else builds
          # against the default_train pairing without publishing.  A
          # tag may carry the same name as a paired branch, so only
          # branch refs are ever allowed to publish.
          resolve=.github/workflows/scripts/resolve-train.py
          entry=""
          publish=false
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            # Status 3 means this branch is simply not paired; any
            # other failure is a broken config resolve-train.py has
            # already explained.
            rc=0
            entry=$("$resolve" branch "$GITHUB_REF_NAME") || rc=$?
            case $rc in
              0) publish=true ;;
              3) entry="" ;;
              *) exit "$rc" ;;
            esac
          fi
          if [ -z "$entry" ]; then
            entry=$("$resolve" default)
          fi
          echo "Kernel pairing: $entry"
          train=$(jq -r '.train' <<< "$entry")
          kernel_repo=$(jq -r '.kernel_repo' <<< "$entry")
          kernel_tag=$(jq -r '.kernel_tag' <<< "$entry")
          {
            echo "TRAIN=$train"
            echo "KERNEL_REPO=$kernel_repo"
            echo "KERNEL_TAG=$kernel_tag"
          } >> "$GITHUB_ENV"
          {
            echo "train=$train"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install TrueNAS kernel headers
        run: |
          # Only the headers are needed to build the modules; the test
          # VM installs the image too, through the same helper so both
          # paths verify downloads identically.
          .github/workflows/scripts/fetch-tn-kernel.py \
            "$KERNEL_REPO" "$KERNEL_TAG" /tmp/tn-kernel 'linux-headers-*'
          cd /tmp/tn-kernel
          release=$(jq -r '.release' manifest.json)
          commit=$(jq -r '.commit' manifest.json)
          echo "TrueNAS $TRAIN kernel: $release ($KERNEL_REPO@$commit)"
          apt-get install -y ./linux-headers-*.deb
          # The TrueNAS kernel packages carry version-free names, so
          # locate the header tree through the build symlink the headers
          # package ships.
          ksrc=$(readlink -f "/lib/modules/$release/build")
          test -f "$ksrc/Module.symvers"
          echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"
          echo "KERNEL_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "KSRC=$ksrc" >> "$GITHUB_ENV"

      - name: Build deb package
        run: |
          mk-build-deps --build-dep contrib/debian/control
          apt install -y ./*.deb
          sh autogen.sh
          ./configure
          cp -a contrib/debian debian
          sed 's/@CFGOPTS@/--enable-debuginfo/g' debian/rules.in > debian/rules
          chmod +x debian/rules
          # Version the rolling debs above the release build they are
          # based on so consecutive builds stay upgradeable.
          dch -b -M \
            -v "$(dpkg-parsechangelog -S Version)+truenas.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" \
            --force-distribution --distribution "${TRAIN}-nightly" \
            "Rolling build of $GITHUB_REF_NAME at ${GITHUB_SHA::12}"
          debuild -us -uc -b
          # Build the kernel modules against the TrueNAS kernel, the
          # same way scale-build does (KVERS/KSRC/KOBJ).
          debian/rules override_dh_binary-modules \
            KVERS="$KERNEL_RELEASE" KSRC="$KSRC" KOBJ="$KSRC"

      - name: Create artifacts dir
        run: mkdir artifacts
        if: success()

      - name: Move artifacts
        run: |
          mv ../*.deb artifacts
          jq -n \
            --arg train "$TRAIN" \
            --arg zfs_version "$(dpkg-parsechangelog -S Version)" \
            --arg kernel_repo "$KERNEL_REPO" \
            --arg kernel_tag "$KERNEL_TAG" \
            --arg kernel_release "$KERNEL_RELEASE" \
            --arg kernel_commit "$KERNEL_COMMIT" \
            '{train: $train, zfs_version: $zfs_version,
              kernel_repo: $kernel_repo, kernel_tag: $kernel_tag,
              kernel_release: $kernel_release, kernel_commit: $kernel_commit}' \
            > artifacts/buildinfo.json
        if: success()

      - uses: actions/upload-artifact@v4
        with:
          name: zfs-native
          path: artifacts
        if: success()

  # On every merge to a branch paired with a train in
  # .github/trains.json - and on the workflow_dispatch runs
  # kernel-watch.yml fires when the TrueNAS kernel moves under an
  # unchanged branch - republish the native debs built above (against
  # the train's TrueNAS production kernel) as assets of a per-train
  # rolling prerelease (<train>-nightly), mirroring the kernel
  # releases.  Release assets (unlike Actions artifacts) never expire and
  # are downloadable anonymously at stable URLs:
  #   https://github.com/truenas/zfs/releases/download/master-nightly/<file>
  # Consumers should fetch manifest.json first to learn the current file
  # names, then verify downloads against SHA256SUMS.
  publish_latest_debs:

    needs: build-native-deb
    # The build job set this from .github/trains.json, and only for
    # branch refs; keeping the whole decision there means the trigger
    # list and the ref namespace are checked in exactly one place.
    if: ${{ needs.build-native-deb.outputs.publish == 'true' }}

    runs-on: ubuntu-22.04

    permissions:
      contents: write
      actions: read

    concurrency:
      group: publish-latest-debs-${{ github.ref }}
      cancel-in-progress: false

    steps:

      - name: Download native debs
        uses: actions/download-artifact@v4
        with:
          name: zfs-native
          path: zfs-native

      - name: Assemble release assets
        run: |
          mkdir release-assets
          # TrueNAS does not ship the dkms or dracut packages; skip them
          # to keep the release lean.
          for deb in zfs-native/*.deb; do
            case "$(basename "$deb")" in
              openzfs-zfs-dkms_*|openzfs-zfs-dracut_*)
                echo "Skipping $(basename "$deb")"
                ;;
              *)
                cp "$deb" release-assets/
                ;;
            esac
          done
          # TRAIN becomes the release tag and the rest are published in
          # manifest.json, so a missing field must stop the run.  A jq
          # failure inside a command substitution does not trip set -e,
          # hence the explicit check: jq -e fails on a null result.
          for var in train kernel_repo kernel_tag kernel_release \
              kernel_commit zfs_version; do
            value=$(jq -er ".$var" zfs-native/buildinfo.json) || {
              echo "ERROR: zfs-native/buildinfo.json has no .$var" >&2
              exit 1
            }
            echo "${var^^}=$value"
          done >> "$GITHUB_ENV"

      - name: Generate checksums and manifest
        run: |
          cd release-assets
          sha256sum *.deb > SHA256SUMS
          ls *.deb | jq -R . | jq -s \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg zfs_version "$ZFS_VERSION" \
            --arg kernel_repo "$KERNEL_REPO" \
            --arg kernel_tag "$KERNEL_TAG" \
            --arg kernel_release "$KERNEL_RELEASE" \
            --arg kernel_commit "$KERNEL_COMMIT" \
            '{
              branch: $branch,
              commit: $commit,
              date: $date,
              run_url: $run_url,
              zfs_version: $zfs_version,
              kernel_repo: $kernel_repo,
              kernel_tag: $kernel_tag,
              kernel_release: $kernel_release,
              kernel_commit: $kernel_commit,
              debs: .
            }' > manifest.json
          cat manifest.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # If the branch has already moved past this commit, let the run
          # building the new tip publish instead - the release must never
          # go back to older debs.
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is now at $tip, not publishing $GITHUB_SHA"
            exit 0
          fi

          # The build job resolved this branch's train and kernel
          # pairing from .github/trains.json and recorded them in
          # buildinfo.json, and gated this job on the same lookup, so
          # only paired branches get here.
          tag="${TRAIN}-nightly"

          {
            echo "Rolling native deb build of \`$GITHUB_REF_NAME\` at $GITHUB_SHA."
            echo
            echo "- ZFS version: \`$ZFS_VERSION\`"
            echo "- Built against kernel: \`$KERNEL_RELEASE\`"
            echo "  ($KERNEL_REPO@${KERNEL_COMMIT::12}) from"
            echo "  https://github.com/$KERNEL_REPO/releases/tag/$KERNEL_TAG"
            echo "- Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "The tag and all assets are replaced on every merge to"
            echo "\`$GITHUB_REF_NAME\` and whenever the TrueNAS kernel moves."
            echo "Fetch \`manifest.json\` to see what is currently published"
            echo "and verify downloads against \`SHA256SUMS\`."
          } > release-notes.md

          gh release delete "$tag" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "TrueNAS $TRAIN OpenZFS debs (nightly)" \
            --notes-file release-notes.md \
            release-assets/*.deb \
            release-assets/SHA256SUMS \
            release-assets/manifest.json
